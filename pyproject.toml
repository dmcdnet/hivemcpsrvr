[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hivemcpsrvr"
version = "0.1.0"
description = "MCP server wrapping the Hive smart home API via pyhive-integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyhive-integration>=1.0.8",
    "aiohttp>=3.9.0",
]

[project.scripts]
hivemcpsrvr = "hivemcpsrvr.server:main"

[tool.hatch.build.targets.wheel]
packages = ["hivemcpsrvr"]
